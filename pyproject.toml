[project]
name = "superset-remediation"
version = "0.1.0"
description = "Devin-driven detection and remediation loop for a Superset fork"
requires-python = ">=3.10"

[tool.ruff]
line-length = 112
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
