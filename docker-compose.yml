services:
  control-plane:
    build: .
    # Bootstrap is idempotent, so every start reconciles the fork's labels,
    # registry and the two automations with what is checked in here, then
    # serves the dashboard. One command from nothing to a running system.
    command: >
      sh -c "python -m scripts.bootstrap &&
             uvicorn src.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    # Not required, so a missing .env fails on bootstrap's own message naming
    # the variable it wants rather than on a compose error about a file.
    env_file:
      - path: .env
        required: false
    volumes:
      - state:/data

volumes:
  state:
