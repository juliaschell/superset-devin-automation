[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-remediation"
version = "0.1.0"
description = "Devin-driven detection and remediation loop for a Superset fork"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "jinja2==3.1.5",
]

# Not installed in the image: nothing here runs in production.
[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[tool.setuptools]
packages = ["bootstrap", "tracker", "remediator", "scanner", "shared"]

[tool.ruff]
line-length = 112
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the tests import the working tree, installed or not.
pythonpath = ["."]
