services:
  control-plane:
    build: .
    ports:
      - "8000:8000"
    environment:
      # replay needs no credentials; live needs the four below.
      MODE: ${MODE:-replay}
      REPO: ${REPO:-juliaschell/superset}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
    volumes:
      - state:/data

volumes:
  state:
